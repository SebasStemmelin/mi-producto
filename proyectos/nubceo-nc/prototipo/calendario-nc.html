<style>
/* Layout: app shell — fixed sidebar + scrolling main; calendar grid; right-side drawer for day detail */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --brand:#3d63d1; --brand-strong:#2f52b8; --brand-soft:#1d2a4c; --on-brand:#ffffff;
  --nc:#b085f3; --nc-soft:#272042; --nc-line:#47376e; --in-soft:#1b2744; --in-line:#304574;
  --warn:#f0ab3a; --warn-soft:#3a2d14; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#161d2c; --surface-2:#1d2639; --line:#2a3448; --fg:#e7ebf4; --muted:#9aa4ba;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--brand);padding:2px 8px 14px;letter-spacing:-.02em}

.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg);text-align:left;width:100%}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn-pri{background:var(--brand);color:var(--on-brand);border-radius:8px;padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.btn-pri:hover{background:var(--brand-strong)}
.ver{color:var(--muted);font-size:11px;text-align:center}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.who strong{display:block;font-size:13px}
.who small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.top .sp{flex:1}
.demo{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.sq{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.menu-btn{display:none}
.page{padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.crumb button{color:var(--muted)} .crumb button:hover{color:var(--brand);text-decoration:underline}
.crumb strong{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:0 0 12px}
.h .sp{flex:1}
.h svg{color:var(--brand)}
.h .btn-pri svg,.h .ib svg{color:var(--on-brand)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--brand);color:var(--on-brand);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.kpi:hover{background:var(--brand-strong)}
.kpi .t{display:flex;justify-content:space-between;font-size:11.5px;opacity:.9}

.sales{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.tabs{display:inline-flex;gap:4px}

.legend{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}

.search{flex:1;min-width:200px;max-width:360px;margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--muted)}
.search input{border:0;background:none;outline:none;color:var(--fg);font:inherit;padding:8px 0;width:100%}
.filters{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;width:260px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px}

.calhead{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;position:relative}

.calhead .btn-pri{position:absolute;right:0}

.grid{min-width:720px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}

.cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.cell.out{background:var(--surface-2)}
.cell.out .n{opacity:.45}
.cell .n{text-align:center;font-size:11.5px;color:var(--muted)}
.cell.today{outline:2px solid var(--brand);outline-offset:-2px}

.chip{border-radius:6px;padding:4px 6px;text-align:left;display:flex;flex-direction:column;gap:3px;border:1px solid transparent}
.chip .a{font-weight:600;font-size:11.5px}

.chip.nc:hover,.chip.nc.sel{border-color:var(--nc)}
.logos{display:flex;gap:2px;align-items:center}
.lg{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:6.5px;font-weight:700;letter-spacing:-.02em;flex:none}
.lg.big{width:30px;height:30px;font-size:9.5px}
.more{color:var(--muted);font-size:10px;margin-left:2px}
.lg-F{background:#1b3fa0} .lg-MP{background:#00a6e8} .lg-PW{background:#e4572e}
.lg-PAMI{background:#1690b0} .lg-OSDE{background:#1f2c64} .lg-SMG{background:#d0233b} .lg-IOMA{background:#2f8f4e}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:12px}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(620px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 6px}
.dh h3{margin:0;font-size:16px;flex:1}
.dnav{display:flex;gap:6px;align-items:center}
.dnav button{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.dnav button:disabled{opacity:.4;cursor:default}
.dnav .x{padding:4px}
.dsub{display:flex;justify-content:space-between;align-items:center;padding:0 18px 12px;color:var(--muted);font-size:12px;gap:10px;flex-wrap:wrap}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 18px 14px}
.totc{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
.totc small{display:block;color:var(--muted);font-size:11px}
.totc strong{font-size:13.5px}
.dt{margin:0 18px 18px;border:1px solid var(--line);border-radius:10px;padding:12px}
.dt .h{margin-bottom:10px}
.ib{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--brand);color:var(--on-brand);font-weight:600;text-align:left;padding:8px;white-space:nowrap}

td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr.hl td{background:var(--brand-soft)}
.lnk{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.pf{display:inline-flex;align-items:center;gap:6px}
.st{width:16px;height:16px;border-radius:50%;background:var(--warn);display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.tbtn{color:var(--muted);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px}

.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;padding-top:10px;flex-wrap:wrap}
.pg{background:var(--brand);color:var(--on-brand);border-radius:6px;padding:2px 8px;font-weight:600}

.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.badge{font-size:11px;font-weight:600;background:var(--nc-soft);color:var(--nc);padding:2px 8px;border-radius:999px}
.dhead small{display:block;color:var(--muted);font-size:12px}
.dhead .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--brand-soft);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}
.tile .ti{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--brand);flex:none}
.tile small{display:block;color:var(--muted);font-size:11px}
.tile strong{font-size:15px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--fg)}
.row span:last-child{text-align:right}
.row em{display:block;font-style:normal;color:var(--warn);font-size:10.5px}
.row.total{background:var(--brand-soft);border-radius:8px;font-weight:700;padding:10px 8px;border:0;margin-top:4px}
.foot{color:var(--muted);font-size:11.5px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:12.5px;max-width:calc(100% - 32px)}
/* responsive */
@media (max-width:1100px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}

  .kpis,.mk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .calhead .btn-pri{position:static}
  .legend{margin-left:0}
}
@media (max-width:520px){
  .kpis,.mk,.sales,.quick{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}

  .who small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const LIQ=[],NC=[];
let lseq=0;
Object.keys(INR).map(Number).sort((a,b)=>a-b).forEach(d=>INR[d].forEach(([p,neto,bruto])=>{
  const id=71242740+lseq*137; lseq++;
  LIQ.push({id:String(id),day:d,p,neto,bruto:bruto??r2(neto/(1-PLAT[p].ded/100)),ded:PLAT[p].ded});
}));
let nseq=0;
Object.keys(NCR).map(Number).sort((a,b)=>a-b).forEach(d=>NCR[d].forEach(([f,monto,liq,lote])=>{
  const cov=FIN[f].cov, pup=liq??r2(monto/(cov/100));
  const early=d<=5, teo=d+3;
  NC.push({lote:String(lote??(67211400+nseq*233)),day:d,f,monto,pup,cov,lab:r2(pup*.25),
    conv:FIN[f].conv,cierre:early?"21-10-2026":"04-11-2026",periodo:early?"01-10-2026 al 15-10-2026":"16-10-2026 al 31-10-2026",
    teo:dmy(teo,11,2026),drog:DROG[nseq%3],emision:dmy(d,11,2026),comp:"NC-"+String(48718+nseq).padStart(8,"0")});
  nseq++;
}));

const ncOf=d=>NC.filter(n=>n.day===d&&S.filt.f.has(n.f));

function monthCells(){

  const cells=[]; for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d)}
  return cells;
}

  return `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${title}">
   <div class="dh"><h3>${title}</h3><div class="dnav"><button ${prev?`data-open="${k}:${prev}"`:"disabled"}>${ic("cl",13)}${prev?dayLabel(prev):"Anterior"}</button><button ${next?`data-open="${k}:${next}"`:"disabled"}>${next?dayLabel(next):"Siguiente"}${ic("cr",13)}</button><button class="x" data-close aria-label="Cerrar">${ic("x",15)}</button></div></div>
   <div class="dsub"><span>${isIn?"Ingresos por plataforma":"Notas de crédito por financiador"}</span><span class="demo">${ic("alert",13)}Datos de demostración</span></div>
   <div class="tot">${tot}</div>

/* ---------- render + routing ---------- */
function render(){
  renderSide();
  const page=document.getElementById("page");
  page.innerHTML=S.view==="inicio"?vInicio():S.view==="detalle"?vDetalle():vCal();
  document.getElementById("layer").innerHTML=(S.view==="calendarios"&&S.panel)?panelHtml():"";
  document.body.style.overflow=S.panel&&S.view==="calendarios"?"hidden":"";
  const q=document.getElementById("q"); if(q) q.addEventListener("keydown",e=>{if(e.key==="Enter") doSearch(q.value.trim())});
}
function hashFor(){
  if(S.view==="inicio") return "inicio";
  if(S.view==="detalle") return "nc-"+S.ncId;
  if(S.panel) return (S.panel.k==="in"?"ingresos-":"creditos-")+S.panel.d;
  return S.tab==="todo"?"calendarios":S.tab==="ingresos"?"calendarios-ingresos":"calendarios-creditos";
}
function sync(){const h="#"+hashFor(); if(location.hash!==h){try{history.replaceState(null,"",h)}catch(e){location.hash=h}} render()}
function fromHash(){
  const h=(location.hash||"").slice(1); let m;
  S.panel=null;
  if(!h||h==="inicio"){S.view="inicio"}
  else if(h==="calendarios"){S.view="calendarios";S.tab="todo"}
  else if(h==="calendarios-ingresos"){S.view="calendarios";S.tab="ingresos"}
  else if(h==="calendarios-creditos"){S.view="calendarios";S.tab="nc"}
  else if((m=h.match(/^(ingresos|creditos)-(\d{1,2})$/))){S.view="calendarios";S.month=M;S.panel={k:m[1]==="ingresos"?"in":"nc",d:+m[2]}}
  else if((m=h.match(/^nc-(\d+)$/))&&NC.some(n=>n.lote===m[1])){S.view="detalle";S.ncId=m[1]}
  else S.view="inicio";
  render();
}
let tt;
function toast(msg){const h=document.getElementById("toastHost");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(tt);tt=setTimeout(()=>h.innerHTML="",2600)}
function doSearch(v){
  if(!v) return;
  const n=NC.find(x=>x.lote===v); if(n){S.view="detalle";S.ncId=n.lote;S.panel=null;return sync()}
  const l=LIQ.find(x=>x.id===v); if(l){S.month=M;S.panel={k:"in",d:l.day};S.hlLiq=l.id;return sync()}
  toast(`No encontramos la liquidación o el lote ${v}. Probá con 67210334 o 71242740.`);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]");
  const side=document.getElementById("side");
  if(e.target.closest("#menuBtn")){side.classList.toggle("open");return}
  if(side.classList.contains("open")&&!e.target.closest("#side")){side.classList.remove("open")}
  if(S.popOpen&&!e.target.closest(".filters")){S.popOpen=false;render();if(!t)return}
  if(!t) return;
  const ds=t.dataset;
  if(ds.nav){side.classList.remove("open");if(ds.nav==="inicio"){S.view="inicio";S.panel=null;return sync()}if(ds.nav==="calendarios"){S.view="calendarios";S.panel=null;return sync()}return toast(`${t.textContent.trim()} queda fuera del alcance de este prototipo.`)}
  if(ds.oos) return toast(`${ds.oos} queda fuera del alcance de este prototipo.`);
  if(ds.go){S.view="calendarios";S.tab=ds.go;S.panel=null;S.month=M;return sync()}
  if(ds.tab){S.tab=ds.tab;return sync()}
  if(ds.open){const [k,d]=ds.open.split(":");S.view="calendarios";S.month=M;S.panel={k,d:+d};S.hlLiq=null;return sync()}
  if(ds.nc){S.view="detalle";S.ncId=ds.nc;S.panel=null;return sync()}
  if("close" in ds){S.panel=null;S.hlLiq=null;return sync()}
  if(ds.month){S.month=Math.min(M+1,Math.max(M-1,S.month+Number(ds.month)));return render()}
  if(ds.sales){S.salesMonth=ds.sales;return render()}
  if(ds.toast) return toast(ds.toast);
  if(t.id==="fBtn"){S.popOpen=!S.popOpen;return render()}
  if("freset" in ds){S.filt.p=new Set(Object.keys(PLAT));S.filt.f=new Set(Object.keys(FIN));return render()}
  if(t.id==="repBtn") return toast("Reporte de noviembre 2026 generado (demo).");
  if(t.id==="bellBtn") return toast("No tenés notificaciones nuevas.");
  if(t.id==="moreBtn") return toast("Menú de cuenta fuera del alcance de este prototipo.");
});
document.addEventListener("change",e=>{
  const c=e.target; if(c.dataset.fp){S.filt.p[c.checked?"add":"delete"](c.dataset.fp);render()}
  if(c.dataset.ff){S.filt.f[c.checked?"add":"delete"](c.dataset.ff);render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.popOpen){S.popOpen=false;render()}else if(S.panel){S.panel=null;sync()}}});
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
